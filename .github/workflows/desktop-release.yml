name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    env:
      # 标签发行不能把未签名预览包上传到正式下载入口。
      MIZTRACE_REQUIRE_MAC_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check version and native architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); const d=JSON.parse(fs.readFileSync('desktop/package.json')); if(p.version!==d.version) throw Error('Version mismatch'); if(process.arch!==process.env.EXPECTED_ARCH) throw Error('Wrong runtime architecture'); if(process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!=='v'+p.version) throw Error('Tag must match package version');"
      - name: Check macOS signing configuration
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          node -e "const config = require('./desktop/macos-signing.cjs').macSigningConfig(); if (config.osxSign && !process.env.MAC_CERT_P12) throw Error('GitHub macOS 构建缺少 MAC_CERT_P12，请上传 Developer ID Application 证书。');"
      - name: Test core
        run: npm test
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Import macOS Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$MAC_CERT_P12" ]]; then
            echo "No Developer ID configured: building an unsigned preview without in-app installation support."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/miztrace-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/miztrace-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/miztrace-signing.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
      - name: Build installers
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run desktop:make
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/miztrace-signing.keychain-db" ]]; then security delete-keychain "$RUNNER_TEMP/miztrace-signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/miztrace-signing.p12"
      - name: Verify macOS distribution signature and notarization
        if: runner.os == 'macOS' && env.MIZTRACE_REQUIRE_MAC_SIGNING == '1'
        run: node scripts/verify-macos-release.mjs
      - name: Smoke test packaged application
        run: node scripts/desktop-smoke.mjs
      - name: Normalize download names and checksums
        run: node scripts/release-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: MizTrace-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/out/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: MizTrace-*
          merge-multiple: true
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          extra=()
          if [[ "$RELEASE_TAG" == *-* ]]; then extra+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ -f "releases/$RELEASE_TAG.md" ]]; then
              gh release create "$RELEASE_TAG" --draft --title "MizTrace $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md" "${extra[@]}"
            else
              gh release create "$RELEASE_TAG" --draft --title "MizTrace $RELEASE_TAG" --generate-notes "${extra[@]}"
            fi
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != "true" ]]; then
            echo "This release is already public. Keep its published files unchanged; use a new version for changes."
            exit 0
          fi
          # 先上传齐全部平台及许可证，再公开。旧版本补发不能覆盖最新正式版入口。
          cp LICENSE LICENSE-MIT LICENSING.md THIRD_PARTY_NOTICES.md release/
          gh release upload "$RELEASE_TAG" release/* --clobber
          PUBLISHED_TAGS="$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          export PUBLISHED_TAGS
          mark_latest="$(node scripts/release-latest.mjs)"
          gh release edit "$RELEASE_TAG" --draft=false --latest="$mark_latest"
